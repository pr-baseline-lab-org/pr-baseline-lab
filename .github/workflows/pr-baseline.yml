name: PR baseline
# Replace every main below with your base branch (for example main). The env context is unavailable
# in a job-level `if`, so the branch name is a literal in the marked places.
on:
  pull_request_target:
    types: [opened, synchronize, reopened, ready_for_review, edited, closed]
  merge_group:
  push:
    branches: [main]
  schedule:
    - cron: '17 * * * *'
  workflow_dispatch:
    inputs:
      mode:
        type: choice
        default: auto
        options: [auto, move-baseline, refresh-pr-statuses]
        description: auto recovers like the schedule; move-baseline forces a move and then refreshes; refresh-pr-statuses only refreshes open PR statuses
      baseline:
        type: string
        default: ''
        description: Name of one baseline to move; blank moves all
      hold:
        type: boolean
        default: false
        description: Lab only, sleep three minutes before running
permissions: {}
env:
  # One source of truth for both jobs. Omit to use the single default baseline.
  PR_BASELINES: '[{"name":"pr-baseline","label":"Require PR update","markers":[".nvmrc",".github/versions.txt"]},{"name":"baseline/docs","scope":["docs/"],"markers":["docs/CONFIG"]}]'
jobs:
  refresh-pr-status:
    name: Refresh the PR status against the baseline
    if: >-
      !github.event.repository.fork &&
      (github.event_name == 'merge_group' || (github.event_name == 'pull_request_target' && github.event.action != 'closed'))
    runs-on: ubuntu-latest
    timeout-minutes: 10
    permissions:
      contents: read
      statuses: write
    concurrency:
      group: pr-baseline-status-${{ github.event.pull_request.number || github.event.merge_group.head_sha }}
      cancel-in-progress: false
    steps:
      - id: pr-baseline
        uses: pr-baseline-lab-org/pr-baseline-action-lab@v0
        with:
          base: main
          baselines: ${{ env.PR_BASELINES }}
      - name: Record outputs (lab only)
        if: ${{ always() }}
        env:
          OUTCOME: ${{ steps.pr-baseline.outcome }}
          OUTPUTS: ${{ toJSON(steps.pr-baseline.outputs) }}
        run: |
          mkdir -p lab-out
          printf '%s' "$OUTPUTS" > lab-out/outputs.json
          printf '%s\n' "$OUTCOME" > lab-out/outcome.txt
      - if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: lab-outputs-${{ github.run_id }}
          path: lab-out
  refresh-pr-statuses:
    name: Move baselines and refresh PR statuses
    if: >-
      !github.event.repository.fork && (
        (github.event_name == 'pull_request_target' && github.event.action == 'closed' && github.event.pull_request.merged) ||
        (github.event_name == 'push' && github.ref_name == 'main') ||
        github.event_name == 'schedule' ||
        github.event_name == 'workflow_dispatch'
      )
    runs-on: ubuntu-latest
    timeout-minutes: 60
    permissions:
      contents: write
      statuses: write
      pull-requests: read
    concurrency:
      group: pr-baseline-refresh
      cancel-in-progress: false
      queue: max # Delete this line on GitHub Enterprise Server; one pending run is enough there.
    steps:
      - if: ${{ inputs.hold }}
        run: sleep 180
      - uses: actions/checkout@3d3c42e5aac5ba805825da76410c181273ba90b1 # v7.0.1
        with:
          ref: main
          fetch-depth: 0
          filter: tree:0
          persist-credentials: false
      - id: pr-baseline
        uses: pr-baseline-lab-org/pr-baseline-action-lab@v0
        with:
          base: main
          baselines: ${{ env.PR_BASELINES }}
          mode: ${{ inputs.mode || 'auto' }}
          force: ${{ inputs.mode == 'move-baseline' }}
          baseline: ${{ inputs.baseline || '' }}
      - if: ${{ always() && steps.pr-baseline.outputs.results-file != '' }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: pr-baseline-refresh
          path: ${{ steps.pr-baseline.outputs.results-file }}
      - name: Record outputs (lab only)
        if: ${{ always() }}
        env:
          OUTCOME: ${{ steps.pr-baseline.outcome }}
          OUTPUTS: ${{ toJSON(steps.pr-baseline.outputs) }}
        run: |
          mkdir -p lab-out
          printf '%s' "$OUTPUTS" > lab-out/outputs.json
          printf '%s\n' "$OUTCOME" > lab-out/outcome.txt
      - if: ${{ always() }}
        uses: actions/upload-artifact@330a01c490aca151604b8cf639adc76d48f6c5d4 # v5.0.0
        with:
          name: lab-outputs-${{ github.run_id }}
          path: lab-out
